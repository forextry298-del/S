services:
  - type: web
    name: nsla-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/nsla.db
    disk:
      name: nsla-data
      mountPath: /var/data
      sizeGB: 1
      - key: ADMIN_USERNAME
        value: nslaadmin
      - key: ADMIN_PASSWORD
        sync: false
